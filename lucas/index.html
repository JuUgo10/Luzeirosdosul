<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#153c36">
<title>Para Lucas · Luzeiros do Sul</title>
<style>
*{box-sizing:border-box}
body{margin:0;color:#173b33;background:#f9f4e9;font:1rem/1.55 system-ui,sans-serif}
main{width:min(100% - 40px,760px);margin:clamp(40px,8vh,92px) auto}
header{border-top:3px solid #a64432;padding-top:16px}
.brand{font-size:.8rem;letter-spacing:.14em;font-weight:700;text-transform:uppercase}
h1{font:normal clamp(2.5rem,7vw,4.9rem)/1.05 Georgia,serif;letter-spacing:-.04em;margin:32px 0;text-wrap:balance}
h1 em{color:#994532}
figure{margin:24px 0}
figcaption{font:1.2rem Georgia,serif;margin-bottom:10px}
video{display:block;width:100%;height:min(65vh,600px);object-fit:contain;background:#17251f;border-radius:12px}
footer{margin-top:16px;text-align:right;font:italic 1.1rem Georgia,serif}
</style>
</head>
<body><main>
<header><div class="brand">Luzeiros do Sul</div>
<h1><em>Lucas,</em> sinta o amor que prepararam pra você!</h1></header>
<section aria-label="Vídeos para Lucas" id="gallery"></section>
<footer>Hoje e Sempre!</footer></main>
<script src="./videos.js"></script>
<script>
const gallery = document.getElementById('gallery');
for (const item of videos) {
  const figure = document.createElement('figure');
  const title = document.createElement('figcaption');
  title.textContent = item.title;
  const player = document.createElement('video');
  player.controls = true;
  player.playsInline = true;
  player.preload = 'metadata';
  player.src = item.file;
  player.setAttribute('aria-label', item.title);
  player.addEventListener('play', () => {
    for (const other of gallery.querySelectorAll('video')) {
      if (other !== player) other.pause();
    }
  });
  figure.append(title, player);
  gallery.append(figure);
}
</script></body></html>
